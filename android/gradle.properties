org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin is the AGP 9 default; no standalone Kotlin plugin is needed.
android.builtInKotlin=true
# Required: audioplayers_android still uses the legacy AGP DSL.
# Flutter's migrator re-adds this flag if removed.
android.newDsl=false
# Upstream plugins have not migrated to the AGP 9 DSL yet; silence the
# resulting sync warnings until those plugins are updated.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
